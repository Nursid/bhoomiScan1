<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BhoomiScan - Land Verification Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #111827; }
    .container { max-width: 640px; margin: 32px auto; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); }
    h1 { margin: 0 0 6px; }
    .subtitle { color: #666; margin-bottom: 22px; }
    label { display: block; font-weight: bold; margin: 14px 0 6px; }
    select, input { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; background: #fff; }
    select:disabled, input:disabled { background: #f3f4f6; color: #9ca3af; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 4px; min-height: 14px; }
    button { width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 10px; background: #111827; color: #fff; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { margin-top: 22px; padding: 15px; border-radius: 10px; background: #f3f4f6; display: none; }
    #result.success { background: #ecfdf5; color: #065f46; }
    #result.error { background: #fef2f2; color: #991b1b; }
    #result pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #111827; background: rgba(255, 255, 255, 0.6); padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
    .row { display: flex; gap: 8px; }
    .row span:first-child { font-weight: bold; min-width: 140px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>BhoomiScan</h1>
    <div class="subtitle">Land verification test. The fields change with the selected state.</div>

    <form id="form" novalidate>
      <label for="state">State</label>
      <select id="state"><option value="">Loading states…</option></select>
      <div id="fields"></div>
      <button id="verify" type="submit" disabled>Verify</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    // Calls this API's own origin. Only the user's login token is used here;
    // the Surepass token never leaves the server.
    const API = "/api/v1/land-verification";

    let TOKEN = sessionStorage.getItem("bhoomiscanToken") || "";
    if (!TOKEN) {
      TOKEN = (prompt("Paste your login token (from /api/auth/mobile-verify):") || "").trim().replace(/^Bearer\s+/i, "");
      if (TOKEN) sessionStorage.setItem("bhoomiscanToken", TOKEN);
    }

    const el = (tag, props = {}, children = []) => {
      const node = Object.assign(document.createElement(tag), props);
      children.forEach((child) => node.append(child));
      return node;
    };

    const api = async (method, path, body) => {
      const res = await fetch(path, {
        method,
        headers: { authorization: `Bearer ${TOKEN}`, ...(body ? { "content-type": "application/json" } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false) {
        const error = new Error(json.error?.message || `HTTP ${res.status}`);
        error.payload = json.error || json;
        throw error;
      }
      return json.data;
    };

    const pick = (values, names) => Object.fromEntries(names.map((name) => [name, values[name]]));

    /* ---------------------------- VerificationResult --------------------------- */

    const VerificationResult = {
      node: document.getElementById("result"),
      clear() { this.node.style.display = "none"; this.node.replaceChildren(); },
      error(error) {
        this.node.className = "error";
        this.node.style.display = "block";
        this.node.replaceChildren(el("strong", { textContent: error.message }), el("pre", { textContent: JSON.stringify(error.payload || {}, null, 2) }));
      },
      success(data) {
        const row = (key, value) => el("div", { className: "row" }, [el("span", { textContent: key }), el("span", { textContent: String(value ?? "-") })]);
        this.node.className = "success";
        this.node.style.display = "block";
        this.node.replaceChildren(
          row("Status", data.status),
          row("Snapshot", `${data.snapshotStatus} (#${data.sequence})`),
          row("Changes", data.changeSummary?.total ?? 0),
          row("Smart contract", data.smartContract?.status),
          row("Verification id", data.verificationId),
          el("pre", { textContent: JSON.stringify(data.record, null, 2) }),
        );
      },
    };

    /* ------------------------------- DynamicField ------------------------------ */

    // One form field described by GET /states: a select fed by its options endpoint,
    // or a free-text input. Enabled only once every field it depends on has a value.
    const DynamicField = (field, onChange) => {
      const id = `field-${field.name}`;
      const input = field.input === "select" ? el("select", { id, disabled: true }) : el("input", { id, type: "text", disabled: true, autocomplete: "off" });
      const hint = el("div", { className: "hint" });
      input.addEventListener("change", () => onChange(field.name));
      if (field.input !== "select") input.addEventListener("input", () => onChange(field.name, { typing: true }));

      return {
        field,
        node: el("div", {}, [el("label", { htmlFor: id, textContent: field.label }), input, hint]),
        get value() { return input.value.trim(); },
        reset() {
          input.value = "";
          input.disabled = true;
          hint.textContent = "";
          if (field.input === "select") input.replaceChildren(el("option", { value: "", textContent: `Select ${field.label}` }));
        },
        async activate(values) {
          input.disabled = false;
          if (field.input !== "select") { hint.textContent = "Enter manually"; return; }
          hint.textContent = "Loading…";
          try {
            const { method, path, body } = field.options;
            const data = await api(method, path, method === "GET" ? undefined : pick(values, body));
            input.replaceChildren(
              el("option", { value: "", textContent: `Select ${field.label}` }),
              ...data.options.map((option) => el("option", { value: option.value, textContent: option.label })),
            );
            hint.textContent = `${data.count} option(s)${data.cached ? " · cached" : ""}`;
          } catch (error) {
            input.disabled = true;
            hint.textContent = `Could not load: ${error.message}`;
          }
        },
      };
    };

    /* ----------------------------- VerificationForm ---------------------------- */

    const VerificationForm = {
      state: null,
      fields: [],
      container: document.getElementById("fields"),
      button: document.getElementById("verify"),

      values() { return Object.fromEntries(this.fields.map((item) => [item.field.name, item.value])); },

      render(state) {
        this.state = state;
        this.fields = state ? state.fields.map((field) => DynamicField(field, (name, opts) => this.changed(name, opts))) : [];
        this.container.replaceChildren(...this.fields.map((item) => item.node));
        this.fields.forEach((item) => item.reset());
        VerificationResult.clear();
        this.refresh();
      },

      // A changed value invalidates everything below it in the hierarchy.
      changed(name, { typing = false } = {}) {
        const index = this.fields.findIndex((item) => item.field.name === name);
        this.fields.slice(index + 1).forEach((item) => item.reset());
        if (!typing) this.refresh();
        this.button.disabled = !this.complete();
      },

      refresh() {
        const values = this.values();
        const next = this.fields.find((item) => !item.value);
        if (next && next.field.dependsOn.every((dep) => values[dep])) next.activate(values);
        this.button.disabled = !this.complete();
      },

      complete() { return this.fields.length > 0 && this.fields.every((item) => item.value); },

      async submit() {
        VerificationResult.clear();
        this.button.disabled = true;
        this.button.textContent = "Verifying…";
        try {
          const { method, path } = this.state.verify;
          VerificationResult.success(await api(method, path, this.values()));
        } catch (error) {
          VerificationResult.error(error);
        } finally {
          this.button.textContent = "Verify";
          this.button.disabled = !this.complete();
        }
      },
    };

    /* ------------------------------ StateSelector ------------------------------ */

    const StateSelector = async () => {
      const select = document.getElementById("state");
      try {
        const { states } = await api("GET", `${API}/states`);
        select.replaceChildren(el("option", { value: "", textContent: "Select State" }), ...states.map((s) => el("option", { value: s.slug, textContent: s.label })));
        select.addEventListener("change", () => VerificationForm.render(states.find((s) => s.slug === select.value) || null));
      } catch (error) {
        select.replaceChildren(el("option", { value: "", textContent: "Could not load states" }));
        VerificationResult.error(error);
      }
    };

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (VerificationForm.complete()) VerificationForm.submit();
    });

    StateSelector();
  </script>
</body>
</html>
