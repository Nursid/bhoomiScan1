openapi: 3.0.3
info:
  title: BhoomiScan Land Verification API
  version: 1.0.0
  description: |
    Backend API for land-record verification: mobile OTP login, Razorpay subscriptions,
    Surepass-backed land records (Punjab), historical snapshots with change detection,
    alerts, and smart-contract anchoring.

    **Envelope.** Success: `{ "success": true, "data": ..., "meta"?: ... }`.
    Error: `{ "success": false, "error": { "code", "message", "details"? }, "requestId" }`.

    **Auth.** `Authorization: Bearer <token>` from `POST /api/auth/mobile-verify` (MSG91 OTP widget).
servers:
  - url: http://localhost:4000
tags:
  - name: Auth
  - name: Users
  - name: Plans & Subscriptions
  - name: Payments
  - name: Land Verification
  - name: Smart Contract
  - name: Alerts

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    State:
      name: state
      in: path
      required: true
      schema: { type: string, example: punjab }
      description: State slug. Supported states come from `GET /land-verification/states`.
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            details: {}
        requestId: { type: string }
    Option:
      type: object
      properties:
        value: { type: string, example: Amritsar }
        label: { type: string, example: Amritsar }
    MetadataResult:
      type: object
      properties:
        state: { type: string }
        level:
          type: string
          description: |
            State-specific list name.
            punjab: districts, tehsils, villages, years, khasras.
            maharashtra: districts, talukas, villages, survey-numbers.
            bihar: districts, anchals, lights, mouzas.
        filters: { type: object }
        options: { type: array, items: { $ref: '#/components/schemas/Option' } }
        count: { type: integer }
        cached: { type: boolean }
    Locator:
      description: Punjab locator (`POST /land-verification/punjab/verify`).
      type: object
      required: [district, tehsil, village, year, khasra_number]
      additionalProperties: false
      properties:
        district: { type: string, example: amritsar }
        tehsil: { type: string, example: ajnala }
        village: { type: string, example: abu said }
        year: { type: string, example: 2020 - 2021 }
        khasra_number: { type: string, example: 14//6/2---1 }
    MaharashtraLocator:
      description: Maharashtra locator (`POST /land-verification/maharashtra/verify`). Uses survey-number terminology; Punjab fields are rejected.
      type: object
      required: [district, taluka, village, survey_part_number, survey_number]
      additionalProperties: false
      properties:
        district: { type: string, example: पुणे }
        taluka: { type: string, example: आंबेगाव }
        village: { type: string, example: अडिवरे }
        survey_part_number: { type: string, example: '1', description: Entered by the user (Surepass has no list for it). }
        survey_number: { type: string, example: '1' }
    BiharLocator:
      description: Bihar locator (`POST /land-verification/bihar/verify`). `light` is Surepass's field name, used verbatim.
      type: object
      required: [district, anchal, light, mouza, plot_number]
      additionalProperties: false
      properties:
        district: { type: string, example: araria }
        anchal: { type: string, example: araria }
        light: { type: string, example: अररिया बस्ती }
        mouza: { type: string, example: अररिया बस्ती - 214/1 }
        plot_number: { type: string, example: '1', description: Entered by the user (Surepass has no list for it). }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        mobile: { type: string, example: '+917081002501' }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [USER, ADMIN] }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: monthly }
        name: { type: string }
        amount: { type: integer, description: Amount in paise, example: 59100 }
        amountDisplay: { type: string, example: '591.00' }
        currency: { type: string, example: INR }
        interval: { type: string, enum: [MONTHLY, QUARTERLY] }
        durationMonths: { type: integer }
        allowedFrequencies: { type: array, items: { type: string, enum: [WEEKLY, MONTHLY, QUARTERLY] } }
        maxMonitoredLands: { type: integer, nullable: true }
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACTIVE, EXPIRED, CANCELLED, FAILED] }
        plan: { $ref: '#/components/schemas/Plan' }
        amount: { type: integer }
        currency: { type: string }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        isCurrent: { type: boolean }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        status: { type: string, enum: [CREATED, SUCCESS, FAILED, REFUNDED] }
        amount: { type: integer }
        currency: { type: string }
        orderId: { type: string }
        paymentId: { type: string, nullable: true }
    Change:
      type: object
      properties:
        type: { type: string, enum: [ADD, REMOVE, UPDATE] }
        field: { type: string, example: 'owner_details[]' }
        previousValue: { nullable: true }
        currentValue: { nullable: true }
        isCritical: { type: boolean }
    SmartContractRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        provider: { type: string, enum: [HTTP, BSC, DISABLED] }
        status: { type: string, enum: [PENDING, PROCESSING, STORED, ALREADY_STORED, FAILED, PERMANENTLY_FAILED, SKIPPED] }
        dataHash: { type: string }
        reference: { type: string, nullable: true }
        transactionHash: { type: string, nullable: true }
        attempts: { type: integer }
        nextRetryAt: { type: string, format: date-time, nullable: true }
        errorCode: { type: string, nullable: true }
    VerifyResult:
      type: object
      properties:
        verificationId: { type: string, format: uuid }
        status: { type: string, enum: [VERIFIED, UNCHANGED, CHANGED] }
        snapshotStatus: { type: string, enum: [INITIAL, UNCHANGED, CHANGED] }
        isFirstVerification: { type: boolean }
        previousVerification: { type: string, format: uuid, nullable: true, description: Previous snapshot id }
        currentVerification: { type: string, format: uuid, description: New snapshot id }
        previousVerifiedAt: { type: string, format: date-time, nullable: true }
        verifiedAt: { type: string, format: date-time }
        sequence: { type: integer }
        hash: { type: string, description: sha256 of the normalized record (0x-prefixed) }
        changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
        changeSummary:
          type: object
          properties:
            total: { type: integer }
            added: { type: integer }
            removed: { type: integer }
            updated: { type: integer }
            critical: { type: integer }
        record: { type: object, description: Normalized land record }
        source:
          type: object
          properties:
            state: { type: string }
            provider: { type: string }
            reference: { type: string, nullable: true }
        smartContract:
          type: object
          properties:
            recordId: { type: string }
            status: { type: string }
            reference: { type: string, nullable: true }
            transactionHash: { type: string, nullable: true }
        alertId: { type: string, nullable: true }
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [LAND_RECORD_CHANGED, VERIFICATION_FAILED, SMART_CONTRACT_FAILED] }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        title: { type: string }
        message: { type: string }
        data: { type: object }
        status: { type: string, enum: [UNREAD, READ] }
        createdAt: { type: string, format: date-time }

security:
  - bearerAuth: []

paths:
  /api/auth/mobile-verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify the MSG91 widget OTP and get a login token
      description: |
        The app runs the MSG91 widget's sendOtp() and gets a reqId. The backend verifies the OTP
        with MSG91 (widget verifyOtp), finds or creates the user, and issues a JWT.
        Same API as the reference backend's server/mobileVerify.js.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, otp, reqId]
              properties:
                mobile: { type: string, example: '917081002501' }
                otp: { type: string, example: '302348' }
                reqId: { type: string, example: '36697a704157303534313839' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      mobile: { type: string, example: '+917081002501' }
                      loginMethod: { type: string, example: mobile_otp }
                      lastLoginAt: { type: string, format: date-time }
        '400': { description: 'Invalid mobile number / Invalid OTP / reqId is required' }
        '401': { description: 'Invalid or expired OTP, or mobile does not match the OTP session' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { description: Unable to verify OTP with MSG91 }
        '503': { description: Mobile OTP login is not configured on the server }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Identity behind a login token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      mobile: { type: string }
                      email: { type: string, nullable: true }
                      role: { type: string, example: user }
                      loginMethod: { type: string, example: mobile_otp }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Current user and active subscription
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Users]
      summary: Update name / email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email, nullable: true }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/plans:
    get:
      tags: [Plans & Subscriptions]
      security: []
      summary: List active plans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }

  /api/v1/subscriptions/create:
    post:
      tags: [Plans & Subscriptions]
      summary: Create a PENDING subscription (idempotent per plan while unpaid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode: { type: string, enum: [monthly, quarterly] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      subscription: { $ref: '#/components/schemas/Subscription' }
                      reused: { type: boolean }
        '200': { description: Existing unpaid subscription returned }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/subscriptions:
    get:
      tags: [Plans & Subscriptions]
      summary: Subscription history
      responses:
        '200': { description: OK }

  /api/v1/subscriptions/current:
    get:
      tags: [Plans & Subscriptions]
      summary: Active subscription and upcoming (prepaid) periods
      responses:
        '200': { description: OK }

  /api/v1/subscriptions/{id}/cancel:
    post:
      tags: [Plans & Subscriptions]
      summary: Cancel an unpaid subscription
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Cancelled }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/payments/create:
    post:
      tags: [Payments]
      summary: Create a Razorpay order for a PENDING subscription
      description: Amount and currency come from the stored subscription, never from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptionId]
              properties:
                subscriptionId: { type: string, format: uuid }
      responses:
        '201':
          description: Order created; open Razorpay Checkout with `checkout`
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      checkout:
                        type: object
                        properties:
                          keyId: { type: string }
                          orderId: { type: string }
                          amount: { type: integer }
                          currency: { type: string }
                          name: { type: string }
                          description: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/payments/verify:
    post:
      tags: [Payments]
      summary: Verify Checkout result and activate the subscription
      description: |
        Checks the Checkout signature, then fetches the payment from Razorpay and checks
        order id, amount, currency and status (captures `authorized` payments) before activating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                razorpay_order_id: { type: string }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
      responses:
        '200': { description: 'Payment SUCCESS, subscription ACTIVE' }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/payments/webhook:
    post:
      tags: [Payments]
      security: []
      summary: Razorpay webhook
      description: |
        Verified with `x-razorpay-signature` (HMAC-SHA256 of the raw body with the webhook secret),
        idempotent on `x-razorpay-event-id`. Handles payment.captured, order.paid, payment.authorized,
        payment.failed, refund.processed, payment.refunded.
      parameters:
        - { name: x-razorpay-signature, in: header, required: true, schema: { type: string } }
        - { name: x-razorpay-event-id, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Processed / duplicate / ignored }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/payments:
    get:
      tags: [Payments]
      summary: Payment history
      responses:
        '200': { description: OK }

  /api/v1/land-verification/states:
    get:
      tags: [Land Verification]
      summary: Supported states, their providers and their form fields
      description: |
        Each state lists its `fields` in drill-down order. A field has `name`, `label`,
        `input` (`select` or `text`), `dependsOn` (fields that must be filled first) and,
        for selects, `options` = { method, path, body } describing the list endpoint and
        which field values to send. Clients build the form from this instead of hardcoding it.
      responses:
        '200': { description: OK }

  /api/v1/land-verification/{state}/districts:
    get:
      tags: [Land Verification]
      summary: District list (requires active subscription; cached)
      parameters: [{ $ref: '#/components/parameters/State' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/MetadataResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{state}/tehsils:
    post:
      tags: [Land Verification]
      summary: Tehsil list (Punjab)
      parameters: [{ $ref: '#/components/parameters/State' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [district], properties: { district: { type: string, example: amritsar } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{state}/villages:
    post:
      tags: [Land Verification]
      summary: Village list (Punjab)
      parameters: [{ $ref: '#/components/parameters/State' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [district, tehsil]
              properties: { district: { type: string, example: amritsar }, tehsil: { type: string, example: ajnala } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{state}/years:
    post:
      tags: [Land Verification]
      summary: Year list (Punjab)
      parameters: [{ $ref: '#/components/parameters/State' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [district, tehsil, village]
              properties:
                district: { type: string, example: amritsar }
                tehsil: { type: string, example: ajnala }
                village: { type: string, example: abu said }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{state}/khasras:
    post:
      tags: [Land Verification]
      summary: Khasra number list (Punjab)
      parameters: [{ $ref: '#/components/parameters/State' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [district, tehsil, village, year]
              properties:
                district: { type: string, example: amritsar }
                tehsil: { type: string, example: ajnala }
                village: { type: string, example: abu said }
                year: { type: string, example: 2020 - 2021 }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/maharashtra/talukas:
    post:
      tags: [Land Verification]
      summary: Maharashtra taluka list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [district]
              properties:
                district: { type: string, example: पुणे }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/maharashtra/villages:
    post:
      tags: [Land Verification]
      summary: Maharashtra village list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [district, taluka]
              properties:
                district: { type: string, example: पुणे }
                taluka: { type: string, example: आंबेगाव }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/maharashtra/survey-numbers:
    post:
      tags: [Land Verification]
      summary: Maharashtra survey number list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [district, taluka, village, survey_part_number]
              properties:
                district: { type: string, example: पुणे }
                taluka: { type: string, example: आंबेगाव }
                village: { type: string, example: अडिवरे }
                survey_part_number: { type: string, example: '1' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/bihar/anchals:
    post:
      tags: [Land Verification]
      summary: Bihar anchal list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [district]
              properties:
                district: { type: string, example: araria }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/bihar/lights:
    post:
      tags: [Land Verification]
      summary: Bihar light list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [district, anchal]
              properties:
                district: { type: string, example: araria }
                anchal: { type: string, example: araria }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/bihar/mouzas:
    post:
      tags: [Land Verification]
      summary: Bihar mouza list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [district, anchal, light]
              properties:
                district: { type: string, example: araria }
                anchal: { type: string, example: araria }
                light: { type: string, example: अररिया बस्ती }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MetadataResult' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{state}/verify:
    post:
      tags: [Land Verification]
      summary: Verify a land record (stores snapshot, compares with previous, anchors)
      description: The body is the state's own locator; fields of other states are rejected with 422.
      parameters: [{ $ref: '#/components/parameters/State' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/Locator' }
                - { $ref: '#/components/schemas/MaharashtraLocator' }
                - { $ref: '#/components/schemas/BiharLocator' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/VerifyResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification:
    get:
      tags: [Land Verification]
      summary: My tracked land records
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK }

  /api/v1/land-verification/{id}:
    get:
      tags: [Land Verification]
      summary: Land verification with latest snapshot and its changes
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{id}/history:
    get:
      tags: [Land Verification]
      summary: Snapshot history (newest first, without raw responses)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{id}/history/{snapshotId}:
    get:
      tags: [Land Verification]
      summary: One snapshot including the raw provider response and its changes
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{id}/changes:
    get:
      tags: [Land Verification]
      summary: Change history
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: snapshotId, in: query, schema: { type: string, format: uuid } }
        - { name: critical, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/land-verification/{id}/monitoring:
    put:
      tags: [Land Verification]
      summary: Configure recurring verification (WEEKLY / MONTHLY / QUARTERLY)
      description: Enabling requires an active subscription whose plan allows the frequency; disabling never does.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                frequency: { type: string, enum: [WEEKLY, MONTHLY, QUARTERLY] }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/smart-contract/records:
    get:
      tags: [Smart Contract]
      summary: Anchoring records of a land verification
      parameters:
        - { name: landVerificationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      records: { type: array, items: { $ref: '#/components/schemas/SmartContractRecord' } }

  /api/v1/smart-contract/records/{id}:
    get:
      tags: [Smart Contract]
      summary: One anchoring record
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/smart-contract/records/{id}/retry:
    post:
      tags: [Smart Contract]
      summary: Retry a FAILED / PERMANENTLY_FAILED record now
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Result of the retry }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: My alerts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [UNREAD, READ] } }
        - { name: landVerificationId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }
                      unread: { type: integer }

  /api/v1/alerts/{id}/read:
    patch:
      tags: [Alerts]
      summary: Mark one alert read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }

  /api/v1/alerts/read-all:
    post:
      tags: [Alerts]
      summary: Mark all alerts read
      responses:
        '200': { description: OK }
